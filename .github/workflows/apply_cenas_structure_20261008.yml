name: Apply cenas structure
on:
  push:
    paths:
      - '.github/workflows/apply_cenas_structure_20261008.yml'
      - 'scripts/apply_cenas_structure_20261008.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cenas structure updater
        run: python scripts/apply_cenas_structure_20261008.py
      - name: Commit cenas structure and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply_cenas_structure_20261008.yml scripts/apply_cenas_structure_20261008.py
          git add index.html service-worker.js README.md MANIFEST_SHA256.md .github/workflows/apply_cenas_structure_20261008.yml scripts/apply_cenas_structure_20261008.py
          git commit -m "Group dinner recipes under one section"
          git pull --rebase origin main
          git push
