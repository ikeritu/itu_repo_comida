name: Apply recipe 06

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_recipe_06.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run recipe updater
        run: python scripts/apply_recipe_06.py

      - name: Commit recipe 06 and cleanup
        run: |
          rm -f .github/workflows/apply_recipe_06.yml
          rm -f scripts/apply_recipe_06.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add receta 06 ensalada de patata"
            git push
          fi
