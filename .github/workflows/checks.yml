name: Validar recetario
on:
  push:
    branches: [main, mejora-recetario-v4]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.cjs --check
      - run: node --test tests/*.test.cjs
