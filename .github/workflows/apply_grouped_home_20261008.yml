name: Apply grouped home

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_grouped_home_20261008.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run grouped home updater
        run: python scripts/apply_grouped_home_20261008.py

      - name: Commit grouped home and cleanup
        run: |
          rm -f .github/workflows/apply_grouped_home_20261008.yml
          rm -f scripts/apply_grouped_home_20261008.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Improve grouped recipe home"
            git pull --rebase origin main
            git push
          fi
