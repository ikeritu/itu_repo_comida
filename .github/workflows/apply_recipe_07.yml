name: Apply recipe 07

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_recipe_07.yml'
      - 'scripts/apply_recipe_07.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run recipe updater
        run: python scripts/apply_recipe_07.py

      - name: Commit recipe 07 and cleanup
        run: |
          rm -f .github/workflows/apply_recipe_07.yml
          rm -f scripts/apply_recipe_07.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add receta 07 minipizzas de garbanzos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
