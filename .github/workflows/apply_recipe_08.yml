name: Apply recipe 08

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply_recipe_08.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Run recipe updater
        run: python scripts/apply_recipe_08.py

      - name: Commit recipe 08 and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply_recipe_08.yml
          rm -f scripts/apply_recipe_08.py
          rmdir scripts 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add receta 08 ensalada Big Mac de pasta"
            git pull --rebase origin main
            git push
          fi
